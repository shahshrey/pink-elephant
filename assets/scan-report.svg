      <text x="858" y="290" fill="#52525b">Next</text>
      <line x1="24" y1="304" x2="936" y2="304" stroke="#efefef"/>

      <text x="36" y="326">5</text>
      <text x="60" y="326" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">.claude/commands/review.md</text>
      <text x="282" y="326">on demand</text>
      <text x="360" y="326" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">1&#183;0&#183;1&#183;0</text>
