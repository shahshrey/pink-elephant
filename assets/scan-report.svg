    <text x="32" y="108" font-size="14" font-weight="600" fill="#52525b">7 instruction files &#183; 23 findings &#183; 4 files load every session</text>

    <rect x="24" y="126" width="912" height="30" rx="6" fill="#f4f4f5"/>
    <g font-size="12" font-weight="700" fill="#52525b">
