<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="title desc">
  <title id="title">Sample Pink Elephant scan report for a repo called acme-web</title>
  <desc id="desc">Seven instruction files, 23 findings, 4 files load every session. Ranked table: AGENTS.md, .cursor/rules/state.mdc and CLAUDE.md are Fix first; skills/deploy/SKILL.md is Next; .claude/commands/review.md is Later.</desc>
  <rect width="960" height="540" rx="16" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="959" height="539" rx="16" fill="none" stroke="#e3e3e3"/>

  <path d="M0 16 a16 16 0 0 1 16 -16 h928 a16 16 0 0 1 16 16 v24 h-960 z" fill="#f4f4f5"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="20" r="6" fill="#febc2e"/>
  <circle cx="64" cy="20" r="6" fill="#28c840"/>
  <text x="480" y="25" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#71717a">/pink-elephant scan</text>

