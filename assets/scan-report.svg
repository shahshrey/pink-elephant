      <text x="768" y="146">Severity</text>
      <text x="858" y="146">Verdict</text>
    </g>

    <g font-size="13" fill="#27272a">
      <text x="36" y="182">1</text>
      <text x="60" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">AGENTS.md</text>
      <text x="282" y="182">always</text>
      <text x="360" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">4&#183;3&#183;1&#183;2</text>
      <text x="452" y="182">L9 &#8220;NEVER use npm. NEVER EVER. Seriously.&#8221;</text>
      <circle cx="774" cy="178" r="5" fill="#e5484d"/><text x="784" y="182">High</text>
      <text x="858" y="182" font-weight="700" fill="#b42318">Fix first</text>
      <line x1="24" y1="196" x2="936" y2="196" stroke="#efefef"/>

      <text x="36" y="218">2</text>
      <text x="60" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">.cursor/rules/state.mdc</text>
      <text x="282" y="218">always</text>
      <text x="360" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">2&#183;0&#183;0&#183;1</text>
      <text x="452" y="218">L3 &#8220;We dropped Redux, so don&#8217;t import it&#8221;</text>
      <circle cx="774" cy="214" r="5" fill="#e5484d"/><text x="784" y="218">High</text>
      <text x="858" y="218" font-weight="700" fill="#b42318">Fix first</text>
      <line x1="24" y1="232" x2="936" y2="232" stroke="#efefef"/>

