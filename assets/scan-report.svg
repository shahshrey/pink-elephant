    <text x="32" y="358" font-size="11.5" fill="#71717a">Ex: exclusions &#183; Em: emphasis &#183; Fr: framing &#183; Ir: irrelevance</text>

    <text x="32" y="394" font-size="15" font-weight="700" fill="#18181b">Fix first</text>
    <g font-size="13" fill="#27272a">
      <text x="32" y="420"><tspan font-weight="600">1. AGENTS.md:</tspan> the npm rule is shouted three times in a file every session reads, which keeps npm in focus.</text>
      <text x="32" y="444"><tspan font-weight="600">2. .cursor/rules/state.mdc:</tspan> an always-apply rule still names Redux, a library the project removed.</text>
      <text x="32" y="468"><tspan font-weight="600">3. CLAUDE.md:</tspan> five &#8220;X, not Y&#8221; contrasts and bans load on every task.</text>
    </g>
    <text x="32" y="502" font-size="12.5" fill="#71717a">Clean: .github/copilot-instructions.md, .claude/agents/triage.md</text>
    <text x="32" y="524" font-size="12.5" fill="#71717a">Next: run /pink-elephant AGENTS.md for the full audit with rewrites, or reply &#8220;audit the top 3&#8221;.</text>
  </g>
</svg>
