      <text x="282" y="254">always</text>
      <text x="360" y="254" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">3&#183;0&#183;2&#183;0</text>
      <text x="452" y="254">L22 &#8220;Be a reviewer, not a rewriter&#8221;</text>
      <circle cx="774" cy="250" r="5" fill="#f76b15"/><text x="784" y="254">Medium</text>
      <text x="858" y="254" font-weight="700" fill="#b42318">Fix first</text>
      <line x1="24" y1="268" x2="936" y2="268" stroke="#efefef"/>

